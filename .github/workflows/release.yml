name: Release

on:
  push:
    tags: ['v*.*.*']
  # Manual runs build the zip and attach it to the run only; they never publish a release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build plugin zip
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the plugin version
        id: version
        run: |
          header="$(sed -n 's/^ \* Version:[[:space:]]*//p' mailinglist-plugin.php | head -n1)"
          constant="$(sed -n "s/^define( 'MLP_VERSION', '\(.*\)' );/\1/p" mailinglist-plugin.php | head -n1)"
          echo "header=$header constant=$constant"
          test -n "$header"
          test "$header" = "$constant"
          echo "version=$header" >> "$GITHUB_OUTPUT"

      - name: Tag must match the plugin version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "${{ steps.version.outputs.version }}" ]; then
            echo "Tag v$tag does not match plugin version ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

      - name: Build zip
        run: bin/build-zip.sh dist

      - uses: actions/upload-artifact@v7
        with:
          name: mailinglist-plugin-${{ steps.version.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mailinglist-plugin-${{ needs.build.outputs.version }}
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
